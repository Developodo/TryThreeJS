#gustReadout{font-size:11px;opacity:.8;margin-top:7px}@media(max-width:600px){#windPanel{top:164px;right:8px;min-width:135px;padding:8px}#windPanel input{width:75px}}</style><div id="windPanel"><button id="windToggle" aria-pressed="false">🌬 Activar sonido del viento</button><label>Viento <input id="windLevel" type="range" min="0" max="100" value="75"></label><label>Arena <input id="sandLevel" type="range" min="0" max="100" value="80"></label><div id="gustReadout">Ráfagas suaves</div></div><script>
// Versión totalmente autónoma: WebGL directo, sin módulos, servidor ni conexiones.
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl',{antialias:true,alpha:false});if(!gl){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Este navegador no admite WebGL';throw Error('WebGL no disponible')}
const vs=`attribute vec2 a;varying vec2 uv;void main(){uv=a;gl_Position=vec4(a,0.,1.);}`;
const fs=`precision highp float;varying vec2 uv;uniform vec2 res;uniform float time;uniform vec2 look;uniform float zoom;uniform float effects;uniform float sunIntensity;uniform float hour;uniform float windStrength;
#define PI 3.14159265
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}float fbm(vec2 p){return .5*noise(p)+.25*noise(p*2.07)+.125*noise(p*4.13)+.0625*noise(p*8.17);}
float solarAngle(){return (hour-6.)*PI/12.;}
vec3 sunDir(){float a=solarAngle();return normalize(vec3(.18*cos(a),sin(a),.984*cos(a)));}
vec3 moonDir(){float a=solarAngle()+PI;return normalize(vec3(.18*cos(a),sin(a),.984*cos(a)));}
float daylight(){return smoothstep(-.12,.20,sunDir().y);}
float nightness(){return 1.-smoothstep(-.18,.06,sunDir().y);}
float starfield(vec3 rd){vec2 p=vec2(atan(rd.z,rd.x),asin(clamp(rd.y,-1.,1.)))*vec2(235.,180.);vec2 cell=floor(p);vec2 f=fract(p)-.5;float h=hash(cell);vec2 offset=vec2(hash(cell+11.3),hash(cell+31.7))-.5;float d=length(f-offset*.7);float star=(1.-smoothstep(.012,.043,d))*step(.987,h);float twinkle=.76+.24*sin(time*.65+h*90.);return star*twinkle*(.4+1.8*pow(hash(cell+7.1),4.));}
float moonDisk(vec3 rd){float co=dot(rd,moonDir());float d=acos(clamp(co,-1.,1.));return 1.-smoothstep(.022,.0235,d);}
float solarRadius(){float elevation=abs(sunDir().y);return mix(.035,.0105,smoothstep(.005,.24,elevation));}
float sunDisk(vec3 rd){float ang=acos(clamp(dot(rd,sunDir()),-1.,1.));float radius=solarRadius();return 1.-smoothstep(radius*.96,radius*1.035,ang);}
float lunarCrater(vec2 p,vec2 center,float radius){float d=length(p-center)/radius;return (1.-smoothstep(.63,.96,d))*.16+exp(-pow((d-1.02)*10.,2.))*.11;}

float clouds(vec3 rd){
 if(rd.y<.004)return 0.;
 vec2 p=rd.xz/max(rd.y+.13,.12)*1.42;
 vec2 wind=vec2(time*.012,time*.004);
 float base=fbm(p*.55+wind);
 float billow=fbm(p*1.25+wind*1.6);
 float detail=fbm(p*3.1+wind*2.8);
 float shape=base*.66+billow*.28+detail*.06;
 float cumulus=smoothstep(.475,.665,shape);
 float thin=smoothstep(.56,.70,fbm(p*.28+wind*.5))*.22;
 return clamp(cumulus+thin,0.,1.)*smoothstep(.005,.13,rd.y);
}
vec3 sky(vec3 rd){
 float y=max(rd.y,0.);float sunY=sunDir().y;float day=daylight(),night=nightness();
 float horizon=pow(1.-y,5.);float sd=max(dot(rd,sunDir()),0.);
 // Color cálido únicamente hacia el astro solar; la región opuesta conserva azules fríos.
 vec2 solarAz=normalize(sunDir().xz);
 vec2 viewAz=normalize(rd.xz+vec2(0.00001));
 float towardsSun=dot(viewAz,solarAz);
 float warmDirection=pow(smoothstep(-.28,.88,towardsSun),1.6);
 float warmHorizon=warmDirection*pow(1.-y,2.0);
 vec3 daySky=mix(vec3(.77,.86,.91),vec3(.19,.44,.73),pow(y,.52));
 float golden=exp(-abs(sunY-.035)*4.3);float twilight=exp(-abs(sunY+.13)*3.8);
 vec3 sunsetSky=mix(vec3(.40,.47,.67),vec3(.28,.24,.52),pow(y,.62));
 sunsetSky=mix(sunsetSky,mix(vec3(1.0,.38,.20),vec3(.44,.29,.52),pow(y,.62)),warmHorizon);
 sunsetSky+=vec3(.16,.08,.09)*pow(sd,12.);
 vec3 nightSky=mix(vec3(.027,.052,.105),vec3(.006,.012,.042),pow(y,.5));
 vec3 c=mix(daySky,sunsetSky,clamp(golden*.95,0.,1.));
 c=mix(c,nightSky,night);
 c+=vec3(.12,.028,.065)*horizon*twilight*warmDirection*(1.-night*.75);
 float cl=clouds(rd);float cloudLight=clamp(day*.85+golden*.7+.08,0.,1.);
 vec3 cloudColor=mix(vec3(.29,.32,.45),mix(vec3(.81,.86,.91),vec3(1.,.53,.32),golden*.8*warmDirection),day);
 c=mix(c,cloudColor,cl*cloudLight);
 float disk=sunDisk(rd);
 // Emisión HDR simulada: núcleo luminoso + aureola de Mie + halo de bloom en varias escalas.
 // El núcleo conserva un borde reconocible incluso cuando el cielo está naranja.
 float low=1.-smoothstep(.015,.28,sunY);
 float sunVisible=smoothstep(-.065,.015,sunY);
 float sunAngle=acos(clamp(dot(rd,sunDir()),-1.,1.));
 float sr=solarRadius();
 vec3 sunColor=mix(vec3(1.0,.96,.78),vec3(1.0,.34,.055),low);
 float innerGlow=exp(-pow(sunAngle/max(sr,0.001),2.)*1.8);
 float nearBloom=exp(-sunAngle*28.)*(.48+.62*low);
 float wideBloom=exp(-sunAngle*7.)*(.12+.22*low);
 float horizontalGlow=exp(-abs(rd.y-sunY)*15.)*pow(sd,7.)*.16*low;
 float cloudOcclusion=1.-cl*.68;
 c+=sunColor*(nearBloom+wideBloom+horizontalGlow)*sunVisible*cloudOcclusion;
 c+=sunColor*innerGlow*1.2*sunVisible*cloudOcclusion;
 c+=mix(vec3(1.6,1.46,1.18),vec3(2.8,.72,.12),low)*disk*sunIntensity*sunVisible*(1.-cl*.80);
 // Halo cálido alrededor del horizonte, sin blanquear todo el cielo.
 c+=vec3(.35,.095,.018)*pow(sd,5.)*low*sunVisible*(1.-cl*.75);

 float md=moonDisk(rd);float mangle=max(dot(rd,moonDir()),0.);
 float moonAngle=acos(clamp(dot(rd,moonDir()),-1.,1.));
 float moonBloom=exp(-moonAngle*32.)*.42+exp(-moonAngle*9.)*.095;
 float moonNear=exp(-pow(moonAngle/.035,2.)*1.2)*.65;
 c+=vec3(.40,.57,.88)*(moonBloom+moonNear)*night*(1.-cl*.55);
 // Textura y fase sobre esfera, con relieve mineral, cráteres y borde iluminado.
 vec3 moon=moonDir();vec3 tangent=normalize(cross(vec3(0.,1.,0.),moon));vec3 bitangent=cross(moon,tangent);
 vec2 mp=vec2(dot(rd,tangent),dot(rd,bitangent))/.024;
 float lunarTexture=fbm(mp*3.7)*.22+fbm(mp*11.)*.065;
 float maria=smoothstep(.49,.65,fbm(mp*2.2+vec2(7.,3.)))*.24;
 float craters=lunarCrater(mp,vec2(-.34,.30),.23)+lunarCrater(mp,vec2(.43,-.25),.18)+lunarCrater(mp,vec2(.1,.54),.12)+lunarCrater(mp,vec2(-.52,-.35),.13);
 float sphere=sqrt(max(0.,1.-dot(mp,mp)));
 float phaseMask=smoothstep(-.05,.025,mp.x*.72+sphere*.62-.10);
 vec3 lunarSurface=vec3(.80,.83,.81)-vec3(lunarTexture+maria+craters);
 lunarSurface*=.76+.24*sphere;
 // Luz propia aparente: material lunar brillante y halo de borde sin perder detalles.
 float rim=pow(1.-sphere,2.0)*.55;
 lunarSurface=lunarSurface*1.55+vec3(.25,.36,.54)*rim;
 c=mix(c,lunarSurface,md*night*phaseMask);
 c+=vec3(.42,.55,.85)*md*night*phaseMask*.14;
 float stars=starfield(rd)*night*(1.-cl*.85)*smoothstep(-.02,.18,rd.y);
 c+=vec3(.79,.86,1.)*stars;
 return c;
}
vec3 lensFlare(vec2 q,vec3 rd,vec3 forward,vec3 right,vec3 up){
 vec3 sun=sunDir();float facing=dot(sun,forward)*daylight();
 if(facing<=.05)return vec3(0.);
 vec2 sp=vec2(dot(sun,right),dot(sun,up))/max(facing,.1)/1.25;
 vec2 d=q-sp;float r=length(d);
 float disk=smoothstep(.014,.009,r);
 float low=1.-smoothstep(.015,.26,sun.y);
 float halo=exp(-r*33.)*.035;
 float streak=exp(-abs(d.y)*170.)*exp(-abs(d.x)*5.)*.085+exp(-abs(d.x)*200.)*exp(-abs(d.y)*7.)*.05;
 vec3 f=mix(vec3(1.,.79,.51),vec3(1.,.37,.12),low)*(disk*.12+halo+streak);
 for(int i=0;i<5;i++){
  float k=float(i);vec2 ghost=sp*(-.22-k*.34);
  float rr=length(q-ghost);
  float ring=exp(-pow((rr-(.018+k*.009))*95.,2.))*.09;
  float orb=exp(-rr*rr/(.00016+k*.00009))*.055;
  vec3 tint=mix(vec3(.42,.78,1.),vec3(1.,.59,.33),mod(k,2.));
  f+=tint*(ring+orb);
 }
 float vignette=1.-smoothstep(.55,1.3,length(sp));
 return f*vignette*effects*(1.-low*.55);
}
float waves(vec2 p,float t){float a=sin(p.y*.32-t*1.45+p.x*.036);float b=sin(p.y*.58-t*2.13-p.x*.055);float c=sin(p.y*.13-t*.75+p.x*.028);return .27*a+.12*b+.35*c;}
float waterHeight(vec2 p){
 float depth=smoothstep(3.,-36.,p.y);
 float phase=p.y*.27-time*1.15+sin(p.x*.045+time*.10)*.65;
 float steep=pow(max(sin(phase),0.),8.);
 float cross=.12*sin(p.x*.18+p.y*.35-time*1.6);
 return depth*(waves(p,time)+steep*.85+cross);
}
vec3 surface(vec2 p,vec3 rd){float shoreline=1.5+1.5*sin(p.x*.025)+.8*sin(p.x*.092);float wetEdge=shoreline+5.2*sin(time*.52+p.x*.022)+1.7*sin(time*.81-p.x*.09);float sand=smoothstep(-1.,2.,p.y-shoreline);float wet=1.-smoothstep(1.,22.,p.y);float grain=noise(p*8.);vec3 dry=vec3(.63,.47,.29)+(.5-grain)*.045;vec3 damp=vec3(.28,.28,.23)+(.5-grain)*.026;vec3 beach=mix(dry,damp,wet*.88);float dune=smoothstep(32.,180.,p.y);float dunes=fbm(vec2(p.x*.008,p.y*.013))*.45+fbm(vec2(p.x*.036,p.y*.021))*.13;beach=mix(beach,vec3(.74,.56,.34)+vec3(.13,.095,.05)*(dunes-.3),dune*.85);float foamLine=exp(-abs(p.y-wetEdge)*.54);float lace=fbm(p*1.2+vec2(time*.2,-time*.48));float thinFoam=foamLine*smoothstep(.28,.65,lace);float wash=1.-smoothstep(-1.,2.,p.y-wetEdge);beach=mix(beach,vec3(.21,.38,.36),wash*.43);beach=mix(beach,vec3(.87,.92,.83),clamp(foamLine*.73+thinFoam*.47,0.,1.));
float h=waterHeight(p);vec2 e=vec2(.13,0.);vec3 n=normalize(vec3(waterHeight(p-e.xy)-waterHeight(p+e.xy),2.*e.x,waterHeight(p-e.yx)-waterHeight(p+e.yx)));float fres=pow(1.-max(dot(n,-rd),0.),4.);float deep=smoothstep(4.,-95.,p.y);vec3 water=mix(vec3(.06,.40,.40),vec3(.008,.105,.17),deep*.9);water+=vec3(.035,.095,.105)*(fbm(p*.7+vec2(time*.12,-time*.35))-.5);water=mix(water,sky(reflect(rd,n)),clamp(fres*.8+.12,0.,.8));vec3 sun=sunDir();float spec=pow(max(dot(reflect(-sun,n),-rd),0.),145.)*daylight();
 float glint=pow(max(dot(reflect(-sun,n),-rd),0.),26.)*(.45+.55*noise(p*.8+time*.35))*daylight();
 float sunsetFactor=1.-smoothstep(.02,.26,sun.y);water+=mix(vec3(1.,.85,.57),vec3(1.,.36,.09),sunsetFactor)*(spec*2.3+glint*(.23+.22*sunsetFactor));
 float lunarSpec=pow(max(dot(reflect(-moonDir(),n),-rd),0.),110.);
 float lunarGlint=pow(max(dot(reflect(-moonDir(),n),-rd),0.),19.);
 water+=vec3(.32,.47,.78)*(lunarSpec*1.25+lunarGlint*.16)*nightness();
 water=mix(water,water*vec3(.25,.34,.58),nightness()*.75);
float band=sin(p.y*.27-time*1.15+sin(p.x*.04)*.7);float crest=smoothstep(.72,.97,band)*smoothstep(-44.,-3.,p.y);float bubbles=fbm(p*1.6+vec2(time*.1,-time*.5));float foam=crest*(.38+.85*smoothstep(.32,.66,bubbles));foam+=exp(-abs(p.y+5.+3.*sin(time*.8+p.x*.05))*.34)*.32*smoothstep(-22.,2.,p.y);water=mix(water,vec3(.89,.97,.94),clamp(foam,0.,.96));beach=mix(beach,beach*vec3(.24,.32,.48),nightness()*.84);return mix(water,beach,sand);}

// Mezquita monumental situada lejos, detrás de la playa, en el desierto.
float boxD(vec3 p,vec3 b){vec3 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,max(d.y,d.z)),0.);}
float cylD(vec3 p,float r,float h){return max(length(p.xz)-r,abs(p.y)-h);}
float domeD(vec3 p,float r){return max(length(p)-r,-p.y);}
vec2 mosque(vec3 p){
 // Edificio al fondo del desierto, alejado de la costa.
 p-=vec3(12.,-.48,235.);
 float d=boxD(p-vec3(0.,5.5,0.),vec3(12.,5.5,8.));float mat=1.;
 // zócalo y escalones
 float s=boxD(p-vec3(0.,.35,0.),vec3(13.5,.35,9.5));if(s<d){d=s;mat=2.;}
 // Cornisa de piedra
 s=boxD(p-vec3(0.,11.1,0.),vec3(12.6,.42,8.6));if(s<d){d=s;mat=2.;}
 // Tambor octogonal aproximado y cúpula principal
 s=cylD(p-vec3(0.,12.7,0.),5.3,1.5);if(s<d){d=s;mat=2.;}
 s=domeD(p-vec3(0.,14.1,0.),5.2);if(s<d){d=s;mat=3.;}
 s=cylD(p-vec3(0.,19.3,0.),.34,.8);if(s<d){d=s;mat=4.;}
 // cúpulas laterales
 for(int i=0;i<2;i++){float x=(float(i)*2.-1.)*8.;s=domeD(p-vec3(x,11.1,0.),3.0);if(s<d){d=s;mat=3.;}}
 // minarete con balcones, remate y aguja
 vec3 m=p-vec3(14.,0.,1.);
 s=boxD(m-vec3(0.,12.,0.),vec3(2.1,12.,2.1));if(s<d){d=s;mat=1.;}
 for(int j=0;j<3;j++){float yy=7.+float(j)*7.5;s=boxD(m-vec3(0.,yy,0.),vec3(2.8,.36,2.8));if(s<d){d=s;mat=2.;}}
 s=domeD(m-vec3(0.,24.,0.),2.35);if(s<d){d=s;mat=3.;}
 s=cylD(m-vec3(0.,27.3,0.),.22,1.2);if(s<d){d=s;mat=4.;}
 // Arcos hundidos en fachada frontal: huecos reales y profundos
 for(int i=0;i<5;i++){
 float x=(float(i)-2.)*4.4;vec3 a=p-vec3(x,4.0,8.0);
 float portal=max(boxD(a-vec3(0.,-1.1,0.),vec3(1.28,2.55,1.6)), -a.y+1.1);
 float arch=max(length(vec2(a.x,a.y-1.35))-1.28,abs(a.z)-1.6);
 float voidD=min(portal,arch);
 d=max(d,-voidD);
 }
 // ventanas oscuras estrechas en el minarete, con relieve
 for(int j=0;j<3;j++){float yy=5.5+float(j)*6.5;vec3 a=m-vec3(0.,yy,2.12);float hole=max(length(vec2(a.x,a.y-.5))-.52,abs(a.z)-.7);hole=min(hole,boxD(a-vec3(0.,-.65,0.),vec3(.52,.9,.7)));d=max(d,-hole);}
 return vec2(d,mat);
}
vec3 mosqueNormal(vec3 p){float e=.025;return normalize(vec3(mosque(p+vec3(e,0.,0.)).x-mosque(p-vec3(e,0.,0.)).x,mosque(p+vec3(0.,e,0.)).x-mosque(p-vec3(0.,e,0.)).x,mosque(p+vec3(0.,0.,e)).x-mosque(p-vec3(0.,0.,e)).x));}
vec4 renderMosque(vec3 ro,vec3 rd,float maxDist){
 // Recorte por esfera para evitar marchar rayos que no apuntan al edificio
 vec3 center=vec3(14.,13.,236.);float b=dot(ro-center,rd);float c=dot(ro-center,ro-center)-35.*35.;float disc=b*b-c;
 if(disc<0.)return vec4(0.);
 float t=max(0.,-b-sqrt(disc));float far=min(maxDist,-b+sqrt(disc));
 for(int i=0;i<92;i++){
  if(t>far)break;
  vec3 p=ro+rd*t;vec2 hit=mosque(p);
  if(hit.x<.035){vec3 n=mosqueNormal(p);float sun=max(dot(n,sunDir()),0.);float ambient=.38+.18*max(n.y,0.);
   vec3 stone=vec3(.73,.61,.46);if(hit.y>1.5)stone=vec3(.87,.75,.56);if(hit.y>2.5)stone=vec3(.68,.56,.39);if(hit.y>3.5)stone=vec3(.83,.68,.30);
   float grain=noise(p.xz*2.4+p.y*.33);stone*=.93+.13*grain;
   vec3 color=stone*(ambient+sun*.77)*mix(.25,1.,daylight());color+=vec3(1.,.69,.40)*pow(max(dot(reflect(-sunDir(),n),-rd),0.),28.)*.07;
   float fog=1.-exp(-t*.0016);color=mix(color,sky(vec3(rd.x,.02,rd.z)),fog*.42);
   return vec4(color,1.);
  }
  t+=max(hit.x*.78,.045);
 }

}

// Mar procedural sin archivos externos. Audio iniciado solo tras una pulsación (política del navegador).

async function toggleSea(){
 try{
  if(!seaCtx){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio Web no disponible');
   seaCtx=new AC();seaMaster=seaCtx.createGain();seaMaster.gain.value=0;seaMaster.connect(seaCtx.destination);
   seaRumble=makeSeaNoise(seaCtx,8,'low');seaSurf=makeSeaNoise(seaCtx,11,'surf');seaHiss=makeSeaNoise(seaCtx,7,'hiss');
   makeBand(seaCtx,seaRumble,35,350,.25);
   seaSurfGain=makeBand(seaCtx,seaSurf,190,2300,.35);
   seaHissGain=makeBand(seaCtx,seaHiss,900,6200,.12);
   seaRumble.start();seaSurf.start();seaHiss.start();
  }
  await seaCtx.resume();seaEnabled=!seaEnabled;
  seaMaster.gain.setTargetAtTime(seaEnabled?Number(document.getElementById('seaVolume').value)/100:0,seaCtx.currentTime,.25);
  document.getElementById('seaToggle').textContent=seaEnabled?'🔇 Silenciar mar':'🔊 Activar mar';
  document.getElementById('seaToggle').setAttribute('aria-pressed',String(seaEnabled));
 }catch(e){document.getElementById('seaToggle').textContent='Audio no disponible';console.warn(e)}
}

function updateSeaAudio(t){
 if(!seaCtx||!seaEnabled)return;
 // El rompiente principal del shader: sin(p.y*.27-time*1.15+...). La envolvente acústica sigue su velocidad temporal.
 // Variaciones lentas entre olas, cresta de espuma y siseo de retirada.
 const phase=t*1.15;
 const swell=Math.pow(.5+.5*Math.sin(phase-.5),2.2);
 const breakFoam=Math.pow(.5+.5*Math.sin(phase-.95),4.0);

 seaHissGain.gain.setTargetAtTime((.025+.32*breakFoam+.13*recede)*irregular,now,.12);
}

   seaRumble.start();seaSurf.start();seaHiss.start();

function updateWind(t){

  windGain.gain.setTargetAtTime(base*(.012+.20*gust),seaCtx.currentTime,.14);
  windLow.frequency.setTargetAtTime(430+gust*1250,seaCtx.currentTime,.2);

}
